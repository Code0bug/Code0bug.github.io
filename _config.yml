# 个人站点配置。用户站点由 GitHub Pages 从 main 分支根目录用内置 Jekyll 构建。
title: 李正鹏
tagline: Code0bug
author: Code0bug
description: >-
  西北工业大学控制工程硕士研究生。
  研究方向：基于深度学习的侧扫声纳图像生成与目标检测。
url: https://code0bug.github.io
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai

theme: minima
markdown: kramdown
permalink: /:year/:month/:day/:title/
# GitHub Pages 默认会发布日期还没到的文章；这里改成到期再出现。
future: false

minima:
  date_format: "%Y-%m-%d"

show_excerpts: true
github_username: Code0bug

header_pages:
  - about.md

defaults:
  - scope:
      path: ""
    values:
      lang: zh-CN
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Code0bug

# 自定义 exclude 会替换 Jekyll 默认列表，因此把默认项一并写上。
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .bundle/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
