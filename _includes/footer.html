<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <p class="footer-id p-name">{{ site.title | escape }}</p>
    {%- include social.html -%}
    {%- if site.description -%}
      <p class="footer-desc">{{ site.description | escape }}</p>
    {%- endif -%}
  </div>
</footer>
